<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Casa y Negocio · Arqueo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f2f7;font-family:Geist,system-ui,sans-serif;color:#24123f}
a{color:#5b21b6}
</style>
</helmet>
<div style="display: flex; align-items: stretch; min-height: 100vh; background: #f4f2f7">
  <dc-import name="Sidebar" active="casa" hint-size="88px,900px"></dc-import>
  <main style="flex: 1 1 auto; min-width: 0; padding: 20px 28px 40px; box-sizing: border-box">
    <div style="max-width: 1360px; margin: 0 auto">
      <dc-import name="ModuloTabs" active="arqueo" hint-size="100%,330px"></dc-import>
      <div style="background: #fbf8f4; border: 1px solid #e7e1ef; border-top: 0; border-radius: 0 0 24px 24px; padding: 28px; display: flex; flex-direction: column; gap: 22px">

        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
          <div style="display: flex; align-items: baseline; gap: 14px">
            <span style="font-size: 44px; font-weight: 300; font-variant-numeric: tabular-nums">{{ cuadran }} de 5</span>
            <span style="font-size: 16px; color: #6b5a86">cuadran</span>
          </div>
          <div style="display: flex; gap: 8px" aria-hidden="true">
            <sc-for list="{{ puntos }}" as="p" hint-placeholder-count="5">
              <span style="width: 14px; height: 14px; border-radius: 999px; background: {{ p.bg }}; box-shadow: inset 0 0 0 2px {{ p.ring }}"></span>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
          <div style="flex: 3 1 700px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #24123f"><span style="width: 10px; height: 10px; border-radius: 3px; background: #24123f"></span>Negocio</div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
              <sc-for list="{{ negocio }}" as="c" hint-placeholder-count="3">
            <section aria-label="{{ c.nombre }}" style="padding: 20px; border-radius: 20px; background: #ffffff; box-shadow: inset 0 0 0 2px {{ c.ring }}; display: flex; flex-direction: column; gap: 14px">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
                <span style="font-size: 16px; font-weight: 600">{{ c.nombre }}</span>
              </div>
              <div>
                <div style="font-size: 12px; color: #857899">Lopest dice</div>
                <div style="font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums">{{ c.sistema }}</div>
              </div>
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #857899">Contaste
                <input type="text" inputmode="numeric" value="{{ c.contado }}" onChange="{{ c.set }}" placeholder="$ 0" style="min-height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid #e7e1ef; background: #fbf8f4; font-size: 24px; font-weight: 300; font-family: Geist, system-ui, sans-serif; color: #24123f; font-variant-numeric: tabular-nums">
              </label>
              <div style="display: flex; align-items: center; gap: 10px; min-height: 32px">
                <span style="flex: none; width: 28px; height: 28px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ c.iconBg }}; color: {{ c.iconFg }}; box-shadow: inset 0 0 0 2px {{ c.iconRing }}" aria-hidden="true">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ c.iconD }}"></path></svg>
                </span>
                <span style="font-size: 15px; font-weight: 600; color: {{ c.resFg }}">{{ c.resultado }}</span>
              </div>
            </section>
              </sc-for>
            </div>
          </div>
          <div style="flex: 2 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #0f766e"><span style="width: 10px; height: 10px; border-radius: 3px; background: #0f766e"></span>Casa</div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
              <sc-for list="{{ casa }}" as="c" hint-placeholder-count="2">
            <section aria-label="{{ c.nombre }}" style="padding: 20px; border-radius: 20px; background: #ffffff; box-shadow: inset 0 0 0 2px {{ c.ring }}; display: flex; flex-direction: column; gap: 14px">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
                <span style="font-size: 16px; font-weight: 600">{{ c.nombre }}</span>
              </div>
              <div>
                <div style="font-size: 12px; color: #857899">Lopest dice</div>
                <div style="font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums">{{ c.sistema }}</div>
              </div>
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #857899">Contaste
                <input type="text" inputmode="numeric" value="{{ c.contado }}" onChange="{{ c.set }}" placeholder="$ 0" style="min-height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid #e7e1ef; background: #fbf8f4; font-size: 24px; font-weight: 300; font-family: Geist, system-ui, sans-serif; color: #24123f; font-variant-numeric: tabular-nums">
              </label>
              <div style="display: flex; align-items: center; gap: 10px; min-height: 32px">
                <span style="flex: none; width: 28px; height: 28px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: {{ c.iconBg }}; color: {{ c.iconFg }}; box-shadow: inset 0 0 0 2px {{ c.iconRing }}" aria-hidden="true">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ c.iconD }}"></path></svg>
                </span>
                <span style="font-size: 15px; font-weight: 600; color: {{ c.resFg }}">{{ c.resultado }}</span>
              </div>
            </section>
              </sc-for>
            </div>
          </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px">
          <div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: #6b5a86">
            <span style="font-weight: 600; color: #24123f">Antes:</span>
            <sc-for list="{{ historial }}" as="h" hint-placeholder-count="4">
              <span style="padding: 4px 10px; border-radius: 999px; background: #ffffff; color: {{ h.fg }}">{{ h.texto }}</span>
            </sc-for>
          </div>
          <button type="button" style="min-height: 52px; padding: 0 26px; border-radius: 14px; border: 0; background: #7c3aed; color: #fff; font-weight: 600; font-size: 16px; cursor: pointer; font-family: Geist, system-ui, sans-serif">Guardar arqueo</button>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { contado: { efectivo: '1.320.000', banco: '', nequi: '1.550.000', casa: '833.000', nu: '7.006.000' } };
  }
  renderVals() {
    const fmt = (n) => (n < 0 ? '−$ ' : '$ ') + Math.abs(n).toLocaleString('es-CO');
    const parse = (t) => { const d = String(t || '').replace(/[^0-9]/g, ''); return d ? Number(d) : null; };
    const base = [
      ['efectivo', 'Efectivo', 'Negocio', 1320000], ['banco', 'Bancolombia', 'Negocio', 11900000], ['nequi', 'Nequi', 'Negocio', 1600000],
      ['casa', 'Cuenta casa', 'Casa', 833000], ['nu', 'Nu · ahorro', 'Casa', 7006000]
    ];
    let cuadran = 0;
    const puntos = [];
    const cuentas = base.map(([id, nombre, grupo, n]) => {
      const raw = this.state.contado[id];
      const v = parse(raw);
      const set = (e) => this.setState({ contado: { ...this.state.contado, [id]: e.target.value } });
      const g = { grupoFg: grupo === 'Casa' ? '#0f766e' : '#6b5a86' };
      if (v === null) {
        puntos.push({ bg: '#fff', ring: '#d6cce4' });
        return { nombre, grupo, ...g, sistema: fmt(n), contado: raw, set, ring: '#ece6f3', resultado: 'Por contar', resFg: '#857899', iconBg: '#fff', iconFg: '#a89cc0', iconRing: '#d6cce4', iconD: 'M12 8v5M12 16h.01' };
      }
      const d = v - n;
      if (d === 0) {
        cuadran++;
        puntos.push({ bg: '#15803d', ring: '#15803d' });
        return { nombre, grupo, ...g, sistema: fmt(n), contado: raw, set, ring: '#bbf7d0', resultado: 'Cuadra', resFg: '#15803d', iconBg: '#15803d', iconFg: '#fff', iconRing: '#15803d', iconD: 'M5 12l5 5 9-10' };
      }
      puntos.push({ bg: '#fee2e2', ring: '#b91c1c' });
      return { nombre, grupo, ...g, sistema: fmt(n), contado: raw, set, ring: '#fca5a5', resultado: (d < 0 ? 'Faltan ' : 'Sobran ') + fmt(Math.abs(d)), resFg: '#b91c1c', iconBg: '#fee2e2', iconFg: '#b91c1c', iconRing: '#b91c1c', iconD: d < 0 ? 'M6 12h12' : 'M12 6v12M6 12h12' };
    });
    return {
      negocio: cuentas.filter((c) => c.grupo === 'Negocio'), casa: cuentas.filter((c) => c.grupo === 'Casa'), cuadran, puntos,
      historial: [
        { texto: '23 nov · Nequi −$ 50.000', fg: '#b91c1c' },
        { texto: '20 nov · cuadró', fg: '#15803d' },
        { texto: '16 nov · cuadró', fg: '#15803d' },
        { texto: '2 nov · Efectivo +$ 20.000', fg: '#b45309' }
      ]
    };
  }
}
</script>
</body>
</html>
