<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Riel de navegación</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Navegación principal" style="flex: 0 0 88px; width: 88px; min-height: 900px; box-sizing: border-box; padding: 18px 10px; background: #24123f; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: Geist, system-ui, sans-serif">
  <a href="Main.dc.html" aria-label="Lopest, inicio" style="display: inline-flex; width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, #8b5cf6, #c026d3); color: #fff; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; text-decoration: none; margin-bottom: 18px">L</a>
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
    <a href="{{ it.href }}" aria-current="{{ it.current }}" style="width: 68px; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; border-radius: 14px; text-decoration: none; color: {{ it.fg }}; background: {{ it.bg }}">
      <span style="display: inline-flex; width: 40px; height: 32px; align-items: center; justify-content: center; border-radius: 10px; background: {{ it.iconBg }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ it.d }}"></path></svg>
      </span>
      <span style="font-size: 11px; font-weight: 500; line-height: 1.15; text-align: center">{{ it.label }}</span>
    </a>
  </sc-for>
  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <span aria-label="[Nombre], Administrador" style="width: 40px; height: 40px; border-radius: 999px; background: #3b2463; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; box-shadow: 0 0 0 2px #8b5cf6">P</span>
    <span style="font-size: 10px; color: #a89cc0">v1.1.0</span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["simulador","clientes","creditos","transferencias","reportes","casa"],"default":"casa"},"$preview":{"width":88,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'casa';
    const base = [
      { id: 'simulador', label: 'Simulador', href: '#', d: 'M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM8 7h8M8 12h2M14 12h2M8 16h2M14 16h2' },
      { id: 'clientes', label: 'Clientes', href: '#', d: 'M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM21 19v-1a4 4 0 0 0-3-3.9M16 3.1a3.5 3.5 0 0 1 0 6.8' },
      { id: 'creditos', label: 'Créditos', href: 'CreditosDueno.dc.html', d: 'M3 7h18v10H3zM12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM6 10v4M18 10v4' },
      { id: 'transferencias', label: 'Transferir', href: '#', d: 'M7 7h13l-3-3M17 17H4l3 3' },
      { id: 'reportes', label: 'Reportes', href: '#', d: 'M4 20V10M10 20V4M16 20v-7M22 20H2' },
      { id: 'casa', label: 'Casa y Negocio', href: 'Main.dc.html', d: 'M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5M10 21v-6h4v6' }
    ];
    const items = base.map((it) => {
      const on = it.id === active;
      return { ...it, current: on ? 'page' : 'false', fg: on ? '#ffffff' : '#c9bfdc', bg: 'transparent', iconBg: on ? '#7c3aed' : 'transparent' };
    });
    return { items };
  }
}
</script>
</body>
</html>
