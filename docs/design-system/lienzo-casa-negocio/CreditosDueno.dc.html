<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Créditos de la familia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f2f7;font-family:Geist,system-ui,sans-serif;color:#24123f}
a{color:#5b21b6}
</style>
</helmet>
<div style="display: flex; align-items: stretch; min-height: 100vh; background: #f4f2f7">
  <dc-import name="Sidebar" active="creditos" hint-size="88px,900px"></dc-import>
  <main style="flex: 1 1 auto; min-width: 0; padding: 20px 28px 40px; box-sizing: border-box">
    <div style="max-width: 1360px; margin: 0 auto">
      <header style="padding: 26px 32px 0; background: #ffffff; border: 1px solid #e7e1ef; border-bottom: 0; border-radius: 24px 24px 0 0">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px">
          <div>
            <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6b5a86">Créditos</div>
            <h1 style="margin: 4px 0 0; font-size: 44px; font-weight: 300; letter-spacing: -0.02em">$ 186.400.000 <span style="color: #a89cc0">en la calle</span></h1>
          </div>
          <div style="display: flex; gap: 18px">
            <sc-for list="{{ duenos }}" as="d" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 10px">
                <span style="width: 40px; height: 40px; border-radius: 999px; background: {{ d.color }}; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600">{{ d.ini }}</span>
                <div>
                  <div style="font-size: 13px; font-weight: 600">{{ d.nombre }}</div>
                  <div style="font-size: 13px; color: #6b5a86; font-variant-numeric: tabular-nums">{{ d.total }}</div>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
        <div role="img" aria-label="Reparto de la cartera por dueño" style="display: flex; gap: 3px; height: 10px; margin-top: 20px; border-radius: 999px; overflow: hidden">
          <sc-for list="{{ duenos }}" as="d" hint-placeholder-count="3"><span style="flex: {{ d.flex }} 1 0; background: {{ d.color }}"></span></sc-for>
        </div>
        <nav aria-label="Filtro por dueño" style="margin-top: 22px; display: flex; gap: 2px">
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
            <button type="button" onClick="{{ t.pick }}" aria-pressed="{{ t.pressed }}" style="min-height: 48px; padding: 0 20px; border: 0; border-radius: 14px 14px 0 0; font-size: 14px; cursor: pointer; font-family: Geist, system-ui, sans-serif; font-weight: {{ t.weight }}; background: {{ t.bg }}; color: {{ t.fg }}">{{ t.label }}</button>
          </sc-for>
        </nav>
      </header>
      <div style="background: #fbf8f4; border: 1px solid #e7e1ef; border-top: 0; border-radius: 0 0 24px 24px; padding: 24px 28px; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{ filas }}" as="c" hint-placeholder-count="8">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 14px 18px; border-radius: 18px; background: {{ c.bg }}">
            <span style="position: relative; flex: none; width: 40px; height: 40px; border-radius: 999px; background: {{ c.color }}; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600" title="{{ c.dueno }}">
              {{ c.ini }}
              <sc-if value="{{ c.ajeno }}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 999px; background: #ffffff; box-shadow: 0 0 0 1px #e7e1ef; display: inline-flex; align-items: center; justify-content: center; color: #24123f" aria-label="Solo lectura">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
                </span>
              </sc-if>
            </span>
            <div style="flex: 1 1 200px; min-width: 0">
              <div style="font-size: 16px; font-weight: 600; color: {{ c.fg }}">{{ c.cliente }}</div>
              <div style="font-size: 12px; color: #857899">{{ c.codigo }} · {{ c.dueno }}</div>
            </div>
            <span style="font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px; white-space: nowrap; background: {{ c.eBg }}; color: {{ c.eFg }}; box-shadow: inset 0 0 0 1px {{ c.eRing }}">{{ c.estado }}</span>
            <span style="flex: 0 0 150px; text-align: right; font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums; color: {{ c.fg }}">{{ c.saldo }}</span>
            <div style="flex: 0 0 180px; display: flex; justify-content: flex-end; gap: 8px">
              <sc-if value="{{ c.propio }}" hint-placeholder-val="{{ true }}">
                <a href="RegistrarPago.dc.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 12px; background: #7c3aed; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none">Cobrar</a>
              </sc-if>
              <a href="{{ c.href }}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 12px; background: #efeaf6; color: #24123f; font-size: 14px; font-weight: 600; text-decoration: none">Abrir</a>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filtro: 'todos' }; }
  renderVals() {
    const fmt = (n) => '$ ' + n.toLocaleString('es-CO');
    const D = {
      yo: { dueno: 'Tuyo', ini: 'P', color: '#24123f' },
      madre: { dueno: '[Madre]', ini: 'M', color: '#0f766e' },
      otro: { dueno: '[Otra persona]', ini: 'O', color: '#a89cc0' }
    };
    const E = {
      dia: { estado: 'Al día', eBg: '#ffffff', eFg: '#15803d', eRing: '#bbf7d0' },
      venc: { estado: '2 cuotas vencidas', eBg: '#fef6e7', eFg: '#92400e', eRing: '#f59e0b' },
      perdido: { estado: 'Perdido', eBg: '#fef2f2', eFg: '#b91c1c', eRing: '#b91c1c' }
    };
    const all = [
      ['LP-26-0310', '[Cliente 1]', 'yo', 3000000, 'dia'],
      ['LP-26-0294', '[Cliente 2]', 'yo', 3420000, 'dia'],
      ['LP-26-0288', '[Cliente 3]', 'madre', 5200000, 'dia'],
      ['LP-26-0251', '[Cliente 4]', 'yo', 500000, 'dia'],
      ['LP-26-0233', '[Cliente 5]', 'madre', 1800000, 'venc'],
      ['LP-26-0188', '[Cliente 6]', 'yo', 4000000, 'venc'],
      ['LP-25-0142', '[Cliente 7]', 'otro', 2600000, 'dia'],
      ['LP-25-0097', '[Cliente 8]', 'yo', 2100000, 'perdido']
    ];
    const f = this.state.filtro;
    const filas = all.filter(([, , d]) => f === 'todos' || (f === 'mios' ? d === 'yo' : d !== 'yo')).map(([codigo, cliente, d, saldo, e]) => {
      const ajeno = d !== 'yo';
      return { codigo, cliente, saldo: fmt(saldo), ...D[d], ...E[e], ajeno, propio: !ajeno && e !== 'perdido', bg: ajeno ? '#f6f3fa' : '#ffffff', fg: ajeno ? '#6b5a86' : '#24123f', href: d === 'yo' && e === 'venc' ? 'PrestamoPerdido.dc.html' : '#' };
    });
    const tabs = [['todos', 'Todos · 42'], ['mios', 'Míos · 28'], ['otros', 'De otros · 14']].map(([id, label]) => {
      const on = f === id;
      return { label, pressed: on ? 'true' : 'false', bg: on ? '#fbf8f4' : 'transparent', fg: on ? '#24123f' : '#857899', weight: on ? 600 : 500, pick: () => this.setState({ filtro: id }) };
    });
    const duenos = [
      { nombre: 'Tuyos', ini: 'P', color: '#24123f', total: '$ 124,6 M', flex: 1246 },
      { nombre: '[Madre]', ini: 'M', color: '#0f766e', total: '$ 49,2 M', flex: 492 },
      { nombre: 'Otros', ini: 'O', color: '#a89cc0', total: '$ 12,6 M', flex: 126 }
    ];
    return { filas, tabs, duenos };
  }
}
</script>
</body>
</html>
