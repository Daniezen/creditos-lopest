<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agenda C · semana con entradas y salidas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<section aria-labelledby="t" style="width: 920px; box-sizing: border-box; padding: 24px; border-radius: 20px; background: #ffffff; font-family: Geist, system-ui, sans-serif; color: #24123f; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <h2 id="t" style="margin: 0; font-size: 22px; font-weight: 300">{{ titulo }}</h2>
    <div style="display: flex; gap: 6px">
      <button type="button" onClick="{{ prev }}" aria-label="Semana anterior" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #e7e1ef; background: #fff; cursor: pointer; font-size: 16px; color: #24123f">‹</button>
      <button type="button" onClick="{{ next }}" aria-label="Semana siguiente" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #e7e1ef; background: #fff; cursor: pointer; font-size: 16px; color: #24123f">›</button>
    </div>
  </div>
  <div style="display: flex; gap: 18px; font-size: 12px; color: #6b5a86">
    <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #24123f"></span>Entra</span>
    <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #5fb3a9"></span>Sale</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{ dias }}" as="d" hint-placeholder-count="7">
      <div style="border-radius: 16px; padding: 12px 10px; background: {{ d.bg }}; box-shadow: inset 0 0 0 {{ d.ringW }} #7c3aed; display: flex; flex-direction: column; gap: 8px; min-height: 360px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-size: 12px; color: #857899">{{ d.sem }}</span>
          <span style="font-size: 26px; font-weight: 300; color: {{ d.numFg }}">{{ d.n }}</span>
        </div>
        <div style="height: 150px; display: flex; flex-direction: column" aria-hidden="true">
          <div style="flex: 1; display: flex; align-items: flex-end; justify-content: center"><span style="width: 60%; height: {{ d.hIn }}; border-radius: 6px 6px 0 0; background: #24123f"></span></div>
          <div style="height: 2px; background: #e7e1ef"></div>
          <div style="flex: 1; display: flex; align-items: flex-start; justify-content: center"><span style="width: 60%; height: {{ d.hOut }}; border-radius: 0 0 6px 6px; background: #5fb3a9"></span></div>
        </div>
        <div style="font-size: 13px; font-variant-numeric: tabular-nums; text-align: center; color: {{ d.netoFg }}">{{ d.neto }}</div>
        <sc-for list="{{ d.items }}" as="i" hint-placeholder-count="1">
          <div style="font-size: 11.5px; line-height: 1.3; padding: 6px 8px; border-radius: 8px; background: #ffffff; color: {{ i.fg }}">{{ i.t }}</div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":920,"height":560}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { semana: 0 }; }
  renderVals() {
    const M = (n) => (n / 1e6).toLocaleString('es-CO', { maximumFractionDigits: 1 }) + ' M';
    const semanas = [
      { titulo: 'Semana del 23 al 29 de noviembre', dias: [
        ['Lun', 23, 0, 0.41, ['Mercado −412 mil']], ['Mar', 24, 0, 0, ['Retiro a la casa']], ['Mié', 25, 1.72, 0, ['5 cuotas por cobrar']],
        ['Jue', 26, 0, 0, []], ['Vie', 27, 0.6, 0, ['2 cuotas']], ['Sáb', 28, 0, 0.2, ['Gasolina (estimado)']], ['Dom', 29, 0, 0, []]] },
      { titulo: 'Semana del 30 nov al 6 dic', dias: [
        ['Lun', 30, 1.43, 0, ['4 cuotas', 'Pasar al ahorro']], ['Mar', 1, 2.14, 0, ['6 cuotas', 'Retiro a la casa']], ['Mié', 2, 0, 0, []],
        ['Jue', 3, 0.3, 0, ['1 cuota']], ['Vie', 4, 0, 0, []], ['Sáb', 5, 1.38, 0, ['4 cuotas']], ['Dom', 6, 0, 0, []]] }
    ];
    const w = semanas[this.state.semana];
    const max = 2.2;
    const dias = w.dias.map(([sem, n, ent, sal, items]) => {
      const hoy = this.state.semana === 0 && n === 25;
      const neto = ent - sal;
      return {
        sem, n, items: items.map((t) => ({ t, fg: t.startsWith('Retiro') || t.startsWith('Pasar') ? '#0f766e' : '#24123f' })),
        hIn: Math.round(ent / max * 72) + 'px', hOut: Math.round(sal / max * 72) + 'px',
        neto: neto === 0 ? '—' : (neto > 0 ? '+' : '−') + M(Math.abs(neto) * 1e6), netoFg: neto > 0 ? '#24123f' : neto < 0 ? '#0f766e' : '#a89cc0',
        bg: hoy ? '#f3edff' : '#fbf8f4', ringW: hoy ? '2px' : '0px', numFg: hoy ? '#7c3aed' : '#24123f'
      };
    });
    return { titulo: w.titulo, dias, prev: () => this.setState({ semana: 0 }), next: () => this.setState({ semana: 1 }) };
  }
}
</script>
</body>
</html>
