<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agenda E · tira de 10 días</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<section aria-label="Próximos días" style="width: 1300px; box-sizing: border-box; padding: 18px 22px; border-radius: 20px; background: #ffffff; font-family: Geist, system-ui, sans-serif; color: #24123f; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; gap: 14px; align-items: stretch">
    <div style="flex: none; width: 190px; padding: 12px 14px; border-radius: 14px; background: #fbf8f4; box-shadow: inset 0 0 0 1px #fecaca; display: flex; flex-direction: column; justify-content: center">
      <div style="font-size: 12px; color: #b91c1c; font-weight: 600">Quedó sin pagar</div>
      <div style="font-size: 22px; font-weight: 300">$ 202.000</div>
      <div style="font-size: 12px; color: #6b5a86">Seguros Bolo y Funeraria</div>
    </div>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{ dias }}" as="d" hint-placeholder-count="10">
        <button type="button" onClick="{{ d.pick }}" aria-pressed="{{ d.pressed }}" style="padding: 10px 6px; border-radius: 14px; border: 0; cursor: pointer; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px; background: {{ d.bg }}; box-shadow: inset 0 0 0 {{ d.ringW }} #7c3aed">
          <span style="font-size: 11px; color: #857899">{{ d.sem }}</span>
          <span style="font-size: 24px; font-weight: 300; line-height: 1; color: {{ d.numFg }}">{{ d.n }}</span>
          <span style="display: flex; gap: 3px; min-height: 7px">
            <sc-for list="{{ d.dots }}" as="p" hint-placeholder-count="1"><span style="width: 7px; height: 7px; border-radius: {{ p.r }}; background: {{ p.c }}"></span></sc-for>
          </span>
          <span style="font-size: 11px; color: #24123f; font-variant-numeric: tabular-nums">{{ d.monto }}</span>
        </button>
      </sc-for>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: #fbf8f4; font-size: 14px">
    <span style="font-weight: 600">{{ selTitulo }}</span>
    <span style="color: #6b5a86">{{ selTexto }}</span>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1300,"height":200}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    const C = { cobro: { c: '#24123f', r: '999px' }, casa: { c: '#0f766e', r: '999px' }, ahorro: { c: '#b8860b', r: '2px' } };
    const raw = [
      ['Hoy', 25, ['cobro'], '+1,7 M', '5 cuotas por cobrar · $ 1.720.000'],
      ['Jue', 26, [], '', 'Nada previsto'],
      ['Vie', 27, ['cobro'], '+0,6 M', '2 cuotas por cobrar'],
      ['Sáb', 28, [], '', 'Nada previsto'],
      ['Dom', 29, [], '', 'Nada previsto'],
      ['Lun', 30, ['cobro', 'ahorro'], '+1,4 M', '4 cuotas por cobrar · pasar $ 631.000 al ahorro'],
      ['Mar', 1, ['cobro', 'casa'], '+2,1 M', '6 cuotas · retiro a la casa'],
      ['Mié', 2, [], '', 'Nada previsto'],
      ['Jue', 3, ['cobro'], '+0,3 M', '1 cuota por cobrar'],
      ['Vie', 4, [], '', 'Nada previsto']
    ];
    const dias = raw.map(([sem, n, k, monto], i) => {
      const sel = this.state.i === i;
      return { sem, n, monto, dots: k.map((x) => C[x]), pressed: sel ? 'true' : 'false', bg: sel ? '#f3edff' : '#fbf8f4', ringW: sel ? '2px' : '0px', numFg: i === 0 ? '#7c3aed' : '#24123f', pick: () => this.setState({ i }) };
    });
    const s = raw[this.state.i];
    return { dias, selTitulo: (s[0] === 'Hoy' ? 'Hoy' : s[0] + ' ' + s[1]), selTexto: s[4] };
  }
}
</script>
</body>
</html>
