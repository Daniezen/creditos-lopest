<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Detalle de crédito · dar por perdido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f2f7;font-family:Geist,system-ui,sans-serif;color:#24123f}
a{color:#5b21b6}
</style>
</helmet>
<div style="display: flex; align-items: stretch; min-height: 100vh; background: #f4f2f7">
  <dc-import name="Sidebar" active="creditos" hint-size="88px,900px"></dc-import>
  <main style="flex: 1 1 auto; min-width: 0; padding: 20px 28px 40px; box-sizing: border-box">
    <div style="max-width: 1360px; margin: 0 auto">
      <header style="padding: 26px 32px 0; background: #ffffff; border: 1px solid #e7e1ef; border-bottom: 0; border-radius: 24px 24px 0 0">
        <div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
          <div style="flex: 999 1 520px; min-width: 0">
            <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6b5a86">[Cliente 6] · LP-26-0188</div>
            <h1 style="margin: 4px 0 0; font-size: 44px; font-weight: 300; letter-spacing: -0.02em">$ 8.000.000 <span style="color: #a89cc0">a 12 meses</span></h1>
            <div style="margin-top: 6px; font-size: 14px; color: #6b5a86">{{ ultimoPago }}</div>
            <ol aria-label="Etapas del crédito" style="list-style: none; margin: 26px 0 0; padding: 0; display: flex; min-width: 0; overflow-x: auto">
              <sc-for list="{{ etapas }}" as="e" hint-placeholder-count="4">
                <li aria-current="{{ e.current }}" style="position: relative; flex: 1 1 0; min-width: 110px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
                  <sc-if value="{{ e.conector }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; right: 50%; top: 17px; width: 100%; height: 3px; background: {{ e.linea }}"></span></sc-if>
                  <span style="position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; background: {{ e.bg }}; color: {{ e.fg }}; box-shadow: inset 0 0 0 {{ e.ringW }} {{ e.ring }}, 0 0 0 5px #ffffff">{{ e.marca }}</span>
                  <span style="font-size: 14px; font-weight: 700; color: {{ e.labelFg }}">{{ e.label }}</span>
                  <span style="font-size: 12px; color: #857899">{{ e.fecha }}</span>
                </li>
              </sc-for>
            </ol>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{ accesos }}" as="a" hint-placeholder-count="3">
              <a href="#" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #f6f3fa; color: #24123f; font-size: 14px; font-weight: 600; text-decoration: none">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ a.d }}"></path></svg>
                {{ a.label }}
              </a>
            </sc-for>
          </div>
        </div>
        <div style="margin-top: 26px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px">
          <nav aria-label="Secciones del crédito" style="display: flex; gap: 2px">
            <a href="#" aria-current="page" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 14px 14px 0 0; background: #fbf8f4; color: #24123f; font-size: 14px; font-weight: 600; text-decoration: none">Resumen</a>
            <a href="#" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; color: #857899; font-size: 14px; font-weight: 500; text-decoration: none">Cuotas</a>
            <a href="#" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; color: #857899; font-size: 14px; font-weight: 500; text-decoration: none">Abonos y plazos</a>
            <a href="#" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; color: #857899; font-size: 14px; font-weight: 500; text-decoration: none">Historial</a>
          </nav>
          <sc-if value="{{ activo }}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{ abrir }}" style="margin-bottom: 6px; min-height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid #fca5a5; background: #ffffff; color: #b91c1c; font-size: 14px; font-weight: 600; cursor: pointer; font-family: Geist, system-ui, sans-serif">Dar por perdido</button>
          </sc-if>
          <sc-if value="{{ perdido }}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{ revertir }}" style="margin-bottom: 6px; min-height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid #e7e1ef; background: #ffffff; color: #24123f; font-size: 14px; font-weight: 600; cursor: pointer; font-family: Geist, system-ui, sans-serif">Revertir</button>
          </sc-if>
        </div>
      </header>

      <div style="background: #fbf8f4; border: 1px solid #e7e1ef; border-top: 0; border-radius: 0 0 24px 24px; padding: 28px; display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
        <section aria-label="Cifras" style="flex: 999 1 480px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px">
          <sc-for list="{{ cifras }}" as="c" hint-placeholder-count="4">
            <div style="padding: 18px 20px; border-radius: 18px; background: #ffffff">
              <div style="font-size: 13px; color: #6b5a86">{{ c.label }}</div>
              <div style="font-size: 30px; font-weight: 300; margin-top: 4px; font-variant-numeric: tabular-nums; color: {{ c.fg }}">{{ c.valor }}</div>
            </div>
          </sc-for>
        </section>

        <sc-if value="{{ dialogo }}" hint-placeholder-val="{{ true }}">
          <section role="dialog" aria-labelledby="dlg" style="flex: 1 1 400px; min-width: 0; padding: 24px; border-radius: 20px; background: #ffffff; box-shadow: inset 0 0 0 2px #b91c1c, 0 18px 45px rgb(36 18 63 / 14%); display: flex; flex-direction: column; gap: 16px">
            <h2 id="dlg" style="margin: 0; font-size: 22px; font-weight: 300">Dar por perdido</h2>
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
              <span style="display: inline-flex; flex-direction: column; padding: 8px 14px; border-radius: 14px; background: #f6f3fa"><span style="font-size: 12px; color: #6b5a86">En la calle</span><span style="font-size: 20px; font-weight: 300">$ 186,4 M</span></span>
              <span style="font-size: 24px; font-weight: 300; color: #c4bad3">−</span>
              <span style="display: inline-flex; flex-direction: column; padding: 8px 14px; border-radius: 14px; background: #fee2e2"><span style="font-size: 12px; color: #991b1b">Se pierde</span><span style="font-size: 20px; font-weight: 400; color: #991b1b">$ 4,0 M</span></span>
              <span style="font-size: 24px; font-weight: 300; color: #c4bad3">=</span>
              <span style="display: inline-flex; flex-direction: column; padding: 8px 14px; border-radius: 14px; background: #24123f; color: #fff"><span style="font-size: 12px; opacity: 0.75">Queda</span><span style="font-size: 20px; font-weight: 400">$ 182,4 M</span></span>
            </div>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #6b5a86">Capital que se pierde
              <input type="text" value="$ 4.000.000" style="min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #e7e1ef; font-size: 20px; font-weight: 300; font-family: Geist, system-ui, sans-serif; color: #24123f">
            </label>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #6b5a86">Por qué
              <textarea rows="3" onChange="{{ setMotivo }}" placeholder="Se fue de la ciudad, no responde desde agosto…" style="padding: 10px 12px; border-radius: 12px; border: 1px solid #e7e1ef; font-size: 15px; font-family: Geist, system-ui, sans-serif; color: #24123f; resize: vertical">{{ motivo }}</textarea>
            </label>
            <div style="display: flex; justify-content: flex-end; gap: 10px">
              <button type="button" onClick="{{ cerrar }}" style="min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid #e7e1ef; background: #fff; color: #24123f; font-size: 15px; font-weight: 600; cursor: pointer; font-family: Geist, system-ui, sans-serif">Cancelar</button>
              <button type="button" onClick="{{ confirmar }}" disabled="{{ bloqueado }}" style="min-height: 48px; padding: 0 18px; border-radius: 12px; border: 0; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: Geist, system-ui, sans-serif; background: {{ btnBg }}">Dar por perdido</button>
            </div>
          </section>
        </sc-if>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dialogo: true, perdido: false, motivo: '' }; }
  renderVals() {
    const s = this.state;
    const listo = s.motivo.trim().length > 0;
    const done = { bg: '#24123f', fg: '#ffffff', ring: '#24123f', ringW: '0px', labelFg: '#24123f', marca: '✓' };
    const cur = (alerta) => ({ bg: '#ffffff', fg: '#24123f', ring: alerta, ringW: '3px', labelFg: '#24123f' });
    const pend = { bg: '#ffffff', fg: '#a89cc0', ring: '#e7e1ef', ringW: '2px', labelFg: '#a89cc0' };
    const etapas = [
      { label: 'Entregado', fecha: '2 mar', ...done },
      { label: 'Pagando', fecha: '6 de 12 cuotas', ...done },
      s.perdido ? { label: 'En mora', fecha: '28 jul', ...done } : { label: 'En mora', fecha: '120 días', marca: '3', current: 'step', ...cur('#d97706') },
      s.perdido ? { label: 'Perdido', fecha: '25 nov', marca: '4', current: 'step', ...cur('#b91c1c') } : { label: 'Perdido', fecha: '', marca: '4', ...pend }
    ].map((e, i, arr) => ({ ...e, current: e.current || 'false', conector: i > 0, linea: (e.ringW === '0px' || e.current === 'step') ? '#24123f' : '#ece6f3' }));
    return {
      etapas,
      dialogo: s.dialogo && !s.perdido, perdido: s.perdido, activo: !s.perdido,
      ultimoPago: s.perdido ? 'Dado por perdido el 25 nov · último pago el 28 jul' : 'Último pago el 28 jul · hace 120 días',
      bloqueLabel: s.perdido ? 'Perdido' : 'Sin pagar', bloqueSub: s.perdido ? 'desde el 25 nov' : 'última cuota el 28 jul',
      bloqueCifra: s.perdido ? '$ 4,0 M' : '120 días',
      bloqueBg: '#fef2f2', bloqueBorde: '#b91c1c', bloqueFg: '#991b1b',
      accesos: [
        { label: 'Cliente', d: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0' },
        { label: 'Llamar', d: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2' },
        { label: 'Documentos', d: 'M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5' }
      ],
      cifras: [
        { label: 'Capital recuperado', valor: '$ 4.000.000', fg: '#24123f' },
        { label: s.perdido ? 'Capital perdido' : 'Capital pendiente', valor: '$ 4.000.000', fg: s.perdido ? '#b91c1c' : '#24123f' },
        { label: 'Intereses cobrados', valor: '$ 1.440.000', fg: '#0f766e' },
        { label: 'Resultado del crédito', valor: s.perdido ? '−$ 2.560.000' : '—', fg: s.perdido ? '#b91c1c' : '#a89cc0' }
      ],
      motivo: s.motivo, bloqueado: !listo, btnBg: listo ? '#b91c1c' : '#fca5a5',
      setMotivo: (e) => this.setState({ motivo: e.target.value }),
      abrir: () => this.setState({ dialogo: true }),
      cerrar: () => this.setState({ dialogo: false }),
      confirmar: () => { if (listo) this.setState({ perdido: true }); },
      revertir: () => this.setState({ perdido: false, dialogo: false })
    };
  }
}
</script>
</body>
</html>
