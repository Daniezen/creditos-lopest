<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agenda B · lista con saldo proyectado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5b21b6}
</style>
</helmet>
<section aria-labelledby="t" style="width: 920px; box-sizing: border-box; padding: 24px; border-radius: 20px; background: #ffffff; font-family: Geist, system-ui, sans-serif; color: #24123f; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; justify-content: space-between; align-items: baseline">
    <h2 id="t" style="margin: 0; font-size: 22px; font-weight: 300">Lo que viene</h2>
    <span style="font-size: 13px; color: #6b5a86">Plata en cuentas si todo pasa como está previsto</span>
  </div>

  <div style="padding: 14px 16px; border-radius: 16px; background: #fbf8f4; box-shadow: inset 0 0 0 1px #fecaca; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #b91c1c">Quedó sin pagar</span>
    <sc-for list="{{ atrasados }}" as="a" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; font-size: 15px; font-weight: 600">{{ a.t }} <span style="font-weight: 400; color: #6b5a86">· era el {{ a.dia }}</span></span>
        <span style="font-size: 15px; font-variant-numeric: tabular-nums">{{ a.m }}</span>
        <a href="#" style="display: inline-flex; align-items: center; min-height: 34px; padding: 0 14px; border-radius: 10px; background: #24123f; color: #fff; font-size: 13px; font-weight: 600; text-decoration: none">Pagar</a>
      </div>
    </sc-for>
  </div>

  <sc-for list="{{ dias }}" as="d" hint-placeholder-count="5">
    <div style="display: grid; grid-template-columns: 70px minmax(0, 1fr) 150px; gap: 16px; align-items: start; padding: 12px 0; border-top: 1px solid #f3eff8">
      <div>
        <div style="font-size: 30px; font-weight: 300; line-height: 1; color: {{ d.numFg }}">{{ d.n }}</div>
        <div style="font-size: 12px; color: #857899">{{ d.sem }}</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{ d.items }}" as="i" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="flex: none; width: 8px; height: 8px; border-radius: {{ i.radius }}; background: {{ i.dot }}"></span>
            <span style="flex: 1; font-size: 14px">{{ i.t }}</span>
            <span style="font-size: 14px; font-variant-numeric: tabular-nums; color: {{ i.fg }}">{{ i.m }}</span>
          </div>
        </sc-for>
      </div>
      <div style="text-align: right">
        <div style="font-size: 18px; font-weight: 300; font-variant-numeric: tabular-nums">{{ d.saldo }}</div>
        <div style="font-size: 11px; color: #857899">en cuentas</div>
      </div>
    </div>
  </sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":920,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const fmt = (n) => (n < 0 ? '−$ ' : '+$ ') + Math.abs(n).toLocaleString('es-CO');
    const INK = '#24123f', TEAL = '#0f766e', GOLD = '#b8860b';
    const it = (t, m, k) => ({ t, m: fmt(m), fg: m > 0 ? INK : '#6b5a86', dot: k === 'casa' ? TEAL : k === 'ahorro' ? GOLD : INK, radius: k === 'ahorro' ? '2px' : '999px' });
    let saldo = 22659000;
    const raw = [
      ['Hoy', 'mié 25', [it('5 cuotas por cobrar', 1720000, 'cobro')]],
      ['30', 'lun', [it('4 cuotas por cobrar', 1430000, 'cobro'), it('Pasar al ahorro', 0, 'ahorro')]],
      ['1', 'mar · dic', [it('Retiro a la casa', -5500000, 'casa'), it('6 cuotas por cobrar', 2140000, 'cobro')]],
      ['5', 'sáb · dic', [it('4 cuotas por cobrar', 1380000, 'cobro')]],
      ['16', 'mié · dic', [it('Crédito Davivienda', -820000, 'casa'), it('Funeraria', -32000, 'casa')]]
    ];
    const dias = raw.map(([n, sem, items]) => {
      // Retiros to the house move money between accounts of the family: they don't change the total.
      saldo += items.reduce((a, i) => a + (i.t.startsWith('Retiro') ? 0 : Number(i.m.replace(/[^0-9]/g, '')) * (i.m.startsWith('−') ? -1 : 1)), 0);
      return { n, sem, items: items.map((i) => i.t === 'Pasar al ahorro' ? { ...i, m: '$ 631.000' } : i), saldo: '$ ' + saldo.toLocaleString('es-CO'), numFg: n === 'Hoy' ? '#7c3aed' : INK };
    });
    return {
      atrasados: [{ t: 'Seguros Bolo', dia: '20', m: '$ 170.000' }, { t: 'Funeraria', dia: '16', m: '$ 32.000' }],
      dias
    };
  }
}
</script>
</body>
</html>
