<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tablero en celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5b21b6}
</style>
</helmet>
<div style="width: 390px; height: 1500px; box-sizing: border-box; background: #fbf8f4; font-family: Geist, system-ui, sans-serif; color: #24123f; display: flex; flex-direction: column; position: relative">
  <header style="padding: 20px 20px 22px; background: #24123f; color: #ffffff; border-radius: 0 0 28px 28px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #c9bfdc">Casa y Negocio</span>
      <span style="width: 34px; height: 34px; border-radius: 999px; background: #3b2463; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; box-shadow: 0 0 0 2px #8b5cf6">P</span>
    </div>
    <div style="font-size: 30px; font-weight: 300; margin-top: 10px">Noviembre</div>
    <div style="font-size: 38px; font-weight: 300; margin-top: 14px; font-variant-numeric: tabular-nums">$ 22.659.000</div>
    <div style="font-size: 13px; color: #c9bfdc">en cuentas · $ 186,4 M en la calle</div>
    <div style="position: relative; height: 26px; margin-top: 18px" role="img" aria-label="Día 25 de 30; dos pagos vencidos">
      <div style="position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 999px; background: #3b2463"></div>
      <div style="position: absolute; left: 0; top: 11px; height: 4px; width: 82%; border-radius: 999px; background: #ffffff"></div>
      <sc-for list="{{ marcas }}" as="m" hint-placeholder-count="6">
        <span style="position: absolute; top: 6px; left: {{ m.left }}; width: 14px; height: 14px; transform: translateX(-50%); border-radius: {{ m.radius }}; background: {{ m.bg }}; box-shadow: 0 0 0 2px {{ m.ring }}"></span>
      </sc-for>
      <span style="position: absolute; top: 0; left: 82%; width: 2px; height: 26px; background: #a78bfa; border-radius: 2px"></span>
    </div>
  </header>

  <div style="padding: 18px 16px 120px; display: flex; flex-direction: column; gap: 14px">
    <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: #ffffff; box-shadow: inset 0 0 0 2px #7c3aed; text-decoration: none; color: #24123f">
      <span style="flex: none; width: 30px; height: 30px; border-radius: 999px; background: #7c3aed; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">1</span>
      <span style="flex: 1">
        <span style="display: block; font-size: 15px; font-weight: 600">Pagar Seguros Bolo</span>
        <span style="display: block; font-size: 12px; color: #5b21b6">$ 170.000 · venció el 20</span>
      </span>
      <span style="font-size: 12px; font-weight: 600; color: #6b5a86">+3</span>
    </a>

    <sc-for list="{{ cuentas }}" as="c" hint-placeholder-count="2">
      <section style="padding: 16px; border-radius: 18px; background: #ffffff">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{ c.color }}; margin-bottom: 8px">{{ c.nombre }}</div>
        <sc-for list="{{ c.filas }}" as="r" hint-placeholder-count="4">
          <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0">
            <span style="font-size: 14px; color: #6b5a86">{{ r.op }} {{ r.label }}</span>
            <span style="font-size: {{ r.size }}; font-weight: {{ r.weight }}; font-variant-numeric: tabular-nums">{{ r.valor }}</span>
          </div>
        </sc-for>
      </section>
    </sc-for>

    <div style="font-size: 18px; font-weight: 300; margin-top: 4px">Sobres</div>
    <div style="overflow-x: auto; margin: 0 -16px; padding: 0 16px">
      <div style="display: flex; gap: 10px; width: max-content">
        <sc-for list="{{ sobres }}" as="s" hint-placeholder-count="4">
          <div style="width: 140px; padding: 14px; border-radius: 16px; background: #ffffff; box-shadow: inset 0 0 0 {{ s.ring }} {{ s.ringColor }}">
            <div style="font-size: 13px; font-weight: 600">{{ s.nombre }}</div>
            <div style="font-size: 20px; font-weight: 300; margin-top: 4px; color: {{ s.fg }}">{{ s.queda }}</div>
            <div style="margin-top: 8px; height: 5px; border-radius: 999px; background: #efeaf6; overflow: hidden"><div style="height: 5px; width: {{ s.ancho }}; background: {{ s.barra }}"></div></div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <button type="button" aria-label="Anotar movimiento" style="position: absolute; right: 18px; bottom: 96px; width: 60px; height: 60px; border-radius: 20px; border: 0; background: #7c3aed; color: #fff; font-size: 28px; font-weight: 300; box-shadow: 0 18px 40px rgb(36 18 63 / 25%); cursor: pointer">+</button>
  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #24123f; padding: 8px 6px 18px">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; text-decoration: none; font-size: 11px; font-weight: 500; color: {{ n.fg }}">
        <span style="width: 36px; height: 26px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; background: {{ n.bg }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"></path></svg>
        </span>
        {{ n.label }}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const fmt = (n) => (n < 0 ? '−$ ' : '$ ') + Math.abs(n).toLocaleString('es-CO');
    const pos = (d) => ((d - 0.5) / 30 * 100).toFixed(1) + '%';
    const marcas = [
      [1, '#0f766e', '#24123f', '3px'], [16, '#ffffff', '#24123f', '999px'], [16.6, '#fecaca', '#b91c1c', '999px'],
      [17.3, '#ffffff', '#24123f', '999px'], [20, '#ffffff', '#24123f', '999px'], [20.7, '#fecaca', '#b91c1c', '999px'], [24, '#0f766e', '#24123f', '3px']
    ].map(([d, bg, ring, radius]) => ({ left: pos(d), bg, ring, radius }));
    const r = (op, label, n, strong) => ({ op, label, valor: fmt(n), size: strong ? '22px' : '15px', weight: strong ? 300 : 400 });
    const cuentas = [
      { nombre: 'Negocio', color: '#6b5a86', filas: [r('', 'Intereses', 6240000), r('−', 'Gastos', 180000), r('=', 'Ganancia', 6060000, true), r('−', 'A la casa', 5500000), r('=', 'Reinvertido', 560000, true)] },
      { nombre: 'Casa', color: '#0f766e', filas: [r('', 'Entró', 5500000), r('−', 'Gastado', 4667000), r('=', 'Hoy', 833000, true), r('=', 'Al cierre', 631000, true)] }
    ];
    const sobre = (nombre, g, t) => {
      const p = g / t, over = p > 1, near = !over && p >= 0.9;
      return { nombre, queda: fmt(t - g), fg: over ? '#b91c1c' : '#24123f', ancho: Math.min(100, Math.round(p * 100)) + '%', barra: over ? '#b91c1c' : near ? '#d97706' : '#24123f', ring: over || near ? '2px' : '1px', ringColor: over ? '#fca5a5' : near ? '#fcd34d' : '#ece6f3' };
    };
    const sobres = [sobre('Mercado', 1210000, 2700000), sobre('Gasolina', 186000, 200000), sobre('Salud', 72000, 50000), sobre('EPM', 312000, 470000), sobre('Imprevistos', 100000, 500000)];
    const nav = [
      ['Clientes', 'M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z'],
      ['Créditos', 'M3 7h18v10H3zM12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z'],
      ['Casa', 'M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5M10 21v-6h4v6'],
      ['Reportes', 'M4 20V10M10 20V4M16 20v-7M22 20H2'],
      ['Más', 'M5 12h.01M12 12h.01M19 12h.01']
    ].map(([label, d]) => ({ label, d, fg: label === 'Casa' ? '#ffffff' : '#c9bfdc', bg: label === 'Casa' ? '#7c3aed' : 'transparent' }));
    return { marcas, cuentas, sobres, nav };
  }
}
</script>
</body>
</html>
