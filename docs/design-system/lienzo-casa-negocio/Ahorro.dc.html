<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Casa y Negocio · Ahorro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f2f7;font-family:Geist,system-ui,sans-serif;color:#24123f}
a{color:#5b21b6}
</style>
</helmet>
<div style="display: flex; align-items: stretch; min-height: 100vh; background: #f4f2f7">
  <dc-import name="Sidebar" active="casa" hint-size="88px,900px"></dc-import>
  <main style="flex: 1 1 auto; min-width: 0; padding: 20px 28px 40px; box-sizing: border-box">
    <div style="max-width: 1360px; margin: 0 auto">
      <dc-import name="ModuloTabs" active="ahorro" hint-size="100%,330px"></dc-import>
      <div style="background: #fbf8f4; border: 1px solid #e7e1ef; border-top: 0; border-radius: 0 0 24px 24px; padding: 28px; display: flex; flex-direction: column; gap: 22px">

        <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: stretch">
          <section aria-labelledby="meta" style="flex: 1 1 360px; min-width: 0; padding: 26px; border-radius: 20px; background: #ffffff; display: flex; align-items: center; gap: 28px; flex-wrap: wrap">
            <div style="position: relative; width: 190px; height: 190px">
              <svg viewBox="0 0 120 120" width="190" height="190" style="transform: rotate(-90deg)" role="img" aria-label="35 por ciento de la meta de ahorro">
                <circle cx="60" cy="60" r="48" fill="none" stroke="#f3eff8" stroke-width="13"></circle>
                <circle cx="60" cy="60" r="48" fill="none" stroke="#b8860b" stroke-width="13" stroke-linecap="round" stroke-dasharray="105.6 301.6"></circle>
              </svg>
              <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
                <span style="font-size: 40px; font-weight: 300; line-height: 1">35 %</span>
                <span style="font-size: 12px; color: #857899; margin-top: 4px">de la meta</span>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <h2 id="meta" style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8a6d0b">Nu · ahorro</h2>
              <div style="font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums">$ 7.006.000</div>
              <div style="font-size: 14px; color: #6b5a86">Meta $ 20.000.000 · fondo de emergencia</div>
              <div style="font-size: 14px; color: #6b5a86">Faltan $ 12.994.000</div>
            </div>
          </section>

          <section aria-labelledby="cierre" style="flex: 1 1 360px; min-width: 0; padding: 26px; border-radius: 20px; background: #24123f; color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; gap: 18px">
            <div>
              <h2 id="cierre" style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #c9bfdc">Cierre de noviembre</h2>
              <div style="font-size: 48px; font-weight: 300; margin-top: 8px; font-variant-numeric: tabular-nums">$ 631.000</div>
              <div style="display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 14px; color: #c9bfdc">
                <span>Cuenta casa</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
                <span>Nu · ahorro</span>
              </div>
            </div>
            <button type="button" style="align-self: flex-start; min-height: 52px; padding: 0 24px; border-radius: 14px; border: 0; background: #fbbf24; color: #24123f; font-weight: 700; font-size: 16px; cursor: pointer; font-family: Geist, system-ui, sans-serif">Pasar al ahorro</button>
          </section>
        </div>

        <section aria-labelledby="meses" style="padding: 22px 24px; border-radius: 20px; background: #ffffff">
          <h2 id="meses" style="margin: 0 0 14px; font-size: 22px; font-weight: 300">Lo que entró cada mes</h2>
          <div style="display: flex; align-items: flex-end; gap: 10px; height: 160px" role="img" aria-label="Depósitos al ahorro por mes">
            <sc-for list="{{ meses }}" as="m" hint-placeholder-count="12">
              <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end">
                <span style="font-size: 11px; color: #6b5a86">{{ m.valor }}</span>
                <span style="width: 100%; max-width: 44px; border-radius: 8px 8px 3px 3px; height: {{ m.h }}; background: {{ m.bg }}; box-shadow: inset 0 0 0 {{ m.ring }} #b8860b"></span>
                <span style="font-size: 12px; color: #857899">{{ m.mes }}</span>
              </div>
            </sc-for>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [['Dic', 0], ['Ene', 0.3], ['Feb', 0.2], ['Mar', 0.4], ['Abr', 0.4], ['May', 0], ['Jun', 0.4], ['Jul', 0.3], ['Ago', 0.6], ['Sep', 0.6], ['Oct', 7.0], ['Nov', 0.631]];
    const max = 7.0;
    const meses = data.map(([mes, v], i) => {
      const pend = i === data.length - 1;
      return {
        mes,
        valor: v ? (v >= 1 ? v.toLocaleString('es-CO', { maximumFractionDigits: 1 }) + ' M' : Math.round(v * 1000) + ' mil') : '—',
        h: Math.max(4, Math.round((v / max) * 110)) + 'px',
        bg: pend ? '#fdf6e3' : v ? '#b8860b' : '#f3eff8',
        ring: pend ? '2px' : '0px'
      };
    });
    return { meses };
  }
}
</script>
</body>
</html>
